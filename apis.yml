aid: rad-power-bikes
name: Rad Power Bikes
description: >-
  Rad Power Bikes is a Seattle-based direct-to-consumer electric bicycle maker, selling
  cargo, utility, commuter and off-road ebikes plus parts, accessories and service plans
  through its own online store and a small network of RadRetail locations. The company
  filed for Chapter 11 in December 2025 and its assets were acquired by Life Electric
  Vehicles Holdings in March 2026; the store continues to operate at radpowerbikes.com.
  Rad Power Bikes publishes no developer program, no public REST OpenAPI and no partner
  API portal. It does, however, expose a real, anonymous, machine-readable agent commerce
  surface on its own domain: a Universal Commerce Protocol (UCP) discovery document at
  /.well-known/ucp, agent instructions at /agents.md and /llms.txt, and a live MCP endpoint
  at /api/ucp/mcp that answers tools/list without credentials with 13 catalog, cart,
  checkout and order tools. That surface is Shopify platform infrastructure, provisioned
  per-store and served from the merchant's own hosts.
