- name: Rad Power Bikes UCP Commerce MCP
  description: >-
    The Universal Commerce Protocol (UCP) shopping service for the Rad Power Bikes online
    store, exposed over MCP. Anonymous tools/list returns 13 tools covering catalog search
    and lookup, product detail, cart create/read/update/cancel, and checkout
    create/read/update/complete/cancel plus order lookup. Checkout completion requires
    contemporaneous human buyer approval per the store's own published agent rules.
