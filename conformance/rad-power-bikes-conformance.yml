compliance_certifications: []
compliance_note: >-
  No trust center, SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP attestation is published on
  any Rad Power Bikes host. trust.radpowerbikes.com does not resolve and
  /pages/trust returns 404. Card data never touches the merchant surface directly - payment
  instruments are issued by Shop Pay, Shopify card or Google Pay handlers - but no
  certification is claimed, so none is recorded.
