- id: ucp
  name: Universal Commerce Protocol (UCP) 2026-04-08
  market: agentic retail commerce
  conforms: true
  declared_in: https://www.radpowerbikes.com/.well-known/ucp
  evidence: >-
    The merchant profile declares service dev.ucp.shopping over transport "mcp" and
    capabilities dev.ucp.shopping.checkout, .cart, .order, .fulfillment, .discount,
    .catalog.search, .catalog.lookup plus the dev.shopify.catalog extension - each bound to
