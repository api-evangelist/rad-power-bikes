status: live
summary: Rad Power Bikes serves a live, anonymous MCP endpoint on its own domain implementing the Universal
  Commerce Protocol (UCP) shopping service. An unauthenticated POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"}
  returned HTTP 200 with 13 tools and full JSON Schema draft 2020-12 inputSchemas. This is the provider's
  only machine-readable API contract; there is no published OpenAPI, GraphQL or partner API program.
ownership:
  verdict: belongs-to-provider
  note: The endpoint is served from the company's own host (www.radpowerbikes.com) and the UCP discovery
    document names the store's own Shopify domain (rad-power-bikes.myshopify.com), merchant_name "Rad
    Power Bikes", merchant_origin www.radpowerbikes.com and shop_id 7999645. The protocol implementation
    itself is Shopify platform infrastructure provisioned per-store — the legitimate templated/platform
    case — but the endpoint, catalog, cart, checkout and payment handlers are Rad Power Bikes' own.
