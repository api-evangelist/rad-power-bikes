tools:
- name: search_catalog
  category: catalog
  description: Search store products by natural-language query and/or filters; cursor-paginated.
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier.
- name: create_cart
  category: cart
  description: Create a new cart.
- name: get_cart
  category: cart
  description: Get cart contents.
- name: update_cart
  category: cart
  description: Perform updates to a cart.
- name: cancel_cart
  category: cart
  description: Cancel a cart.
- name: create_checkout
  category: checkout
  description: Create a checkout; returns line items, totals, discounts and taxes.
- name: get_checkout
  category: checkout
  description: Return checkout detail including line items, totals, discounts and taxes.
- name: update_checkout
  category: checkout
  description: Update a checkout (e.g. shipping address and fulfillment method).
- name: complete_checkout
  category: checkout
  description: >-
    Complete a checkout and return order ID / Thank You Page URL or errors. Requires
    meta.idempotency-key. Buyer approval is mandatory per the store's published agent rules.
- name: cancel_checkout
  category: checkout
  description: Cancel a checkout.
- name: get_order
  category: order
  description: Get the details of an order.
agent_rules:
  human_approval_required: true
  source: https://www.radpowerbikes.com/llms.txt
  note: >-
    Both llms.txt and robots.txt state that agents must not complete checkout, payment or
    order placement without an explicit, contemporaneous human approval step, and direct
    "buy-for-me" agents to the Shop skill at https://shop.app/SKILL.md instead of scripting
    the storefront.
